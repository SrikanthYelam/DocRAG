services:
  docrag:
    build: .
    ports:
      - "8080:8080"
    environment:
      # Taken from your shell (or a git-ignored .env file); never hardcode the key here.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in your environment or a .env file}
    volumes:
      - docrag-data:/data

volumes:
  docrag-data:
